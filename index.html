<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5c58">
<title>Scanner Intolleranze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="stile.css">
<style>
#cam{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
#cam video{width:100%;height:100%;object-fit:cover;display:block}
#cam .mira{position:absolute;inset:30% 12%;border:2px solid #fff;border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
#q{flex:1 1 200px}
.prod{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.prod img,.noimg{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.noimg{background:var(--na-bg)}
.prod div{min-width:0}
.code{font:500 .85rem var(--f-mono);color:var(--muted)}
.semafori{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:420px){.semafori{grid-template-columns:1fr}}
.sem{border-radius:12px;padding:12px;display:grid;gap:4px;align-content:start;min-width:0}
.sem .t{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;opacity:.85}
.sem .v{font-family:var(--f-display);font-weight:800;font-size:1.15rem;line-height:1.2}
.sem .n{font-size:.85rem}
.grp{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.grp .pill{align-self:start}
.grp .det{grid-column:1/-1;font-size:.9rem;color:var(--muted)}
.grp .det b{color:var(--ink)}
.ingr{font-size:.92rem;color:var(--muted);overflow-wrap:anywhere}
ul.note{margin:0;padding-left:18px;font-size:.9rem;color:var(--muted);display:grid;gap:4px}
.lista{display:grid}
.lista button{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;text-align:left;background:transparent;color:var(--ink);border-top:1px solid var(--line);border-radius:0;padding:10px 0;font-weight:400}
.lista button:first-child{border-top:0}
.lista img,.lista .noimg{width:48px;height:48px}
.lista span{min-width:0;overflow-wrap:anywhere}
.cibo{display:grid;gap:10px}
.cibo .lv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media (max-width:480px){.cibo .lv{grid-template-columns:repeat(2,1fr)}}
.cibo .lv div{border-radius:10px;padding:8px;display:grid;gap:2px;font-size:.85rem}
.cibo .lv b{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.cibo + .cibo{border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>Scanner Intolleranze</h1>
      <p class="sub">Glutine, lattosio e FODMAP dai dati di Open Food Facts.</p>
    </div>
    <nav><a href="tabella.html">Tabella FODMAP</a></nav>
  </header>

  <section class="panel" aria-label="Ricerca">
    <button id="btnScan" class="primary big">Scansiona codice a barre</button>
    <div id="cam" hidden><video id="video" playsinline muted></video><div class="mira"></div></div>
    <button id="btnStop" class="ghost" hidden>Chiudi fotocamera</button>
    <form id="form" class="row" autocomplete="off">
      <label for="q" class="label" style="flex-basis:100%">Codice EAN oppure alimento o prodotto</label>
      <input id="q" type="search" placeholder="8076800195057 oppure peperoni" enterkeyhint="search">
      <button class="primary" type="submit">Cerca</button>
    </form>
    <div>
      <div class="label">Prova con</div>
      <div class="chips" style="margin-top:6px">
        <button class="chip" data-q="8076800195057">Spaghetti Barilla</button>
        <button class="chip" data-q="3017620422003">Nutella</button>
        <button class="chip" data-q="peperoni">peperoni</button>
        <button class="chip" data-q="cipolla">cipolla</button>
      </div>
    </div>
  </section>

  <div id="stato" aria-live="polite"></div>
  <section id="risultato" style="display:grid;gap:18px" hidden></section>

  <section class="panel" id="storico" hidden>
    <h3>Scansioni recenti</h3>
    <div class="lista" id="histList"></div>
  </section>

  <footer>Dati prodotti: <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener">Open Food Facts</a> (ODbL). Stima indicativa, non un parere medico.</footer>
</main>

<script>
/* ===================== TABELLA FODMAP (fodmap.json) ===================== */
const GRUPPI = ["fruttosio", "lattosio", "polioli", "fruttani", "gos"];
let DB = null, ALIMENTI = [];
const LIVN = { basso: 0, medio: 1, alto: 2 };
const NOME_LIV = ["Basso", "Medio", "Alto"];
const CLS_LIV = ["ok", "warn", "bad"];

const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
// "carciof*" = inizio parola; altrimenti parola o frase intera
function termRe(lista) {
  const parti = (lista || []).map(t => t.trim().toLowerCase()).filter(Boolean).map(t => {
    const pref = t.endsWith("*");
    const corpo = escRe(t.replace(/\*$/, "")).replace(/[\s-]+/g, "[\\s-]+");
    return "(?<![\\p{L}\\p{N}])" + corpo + (pref ? "" : "(?![\\p{L}\\p{N}])");
  });
  return parti.length ? new RegExp(parti.join("|"), "iu") : null;
}
function compila(db) {
  return (db.alimenti || []).map(a => ({ ...a, re: termRe(a.termini), ex: termRe(a.escludi), tags: new Set(a.en || []) }));
}
async function caricaDB() {
  const r = await fetch("fodmap.json?v=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("fodmap.json non trovato (" + r.status + ")");
  DB = await r.json();
  ALIMENTI = compila(DB);
}

/* ===================== REGOLE GLUTINE / LATTOSIO ===================== */
const GLUT_FORTE = termRe(["frumento","farina di frumento","farina di grano","grano","grano tenero","grano duro","semola","semolato","farro","kamut","spelta","orzo","malto d'orzo","malto","segale","triticale","seitan","cous cous","couscous","bulgur","glutine","pangrattato","pane grattugiato","crusca"]);
const GLUT_ESCL = termRe(["grano saraceno","amido di frumento","glucosio di frumento","sciroppo di glucosio di frumento","senza glutine","glutine assente"]);
const GLUT_TAGS = new Set(["en:wheat","en:wheat-flour","en:barley","en:rye","en:spelt","en:kamut","en:gluten","en:barley-malt","en:triticale","en:durum-wheat-semolina","en:durum-wheat","en:soft-wheat-flour","en:wheat-semolina","en:barley-malt-extract"]);
const AVENA = termRe(["avena","fiocchi d'avena","fiocchi di avena","farina d'avena"]);
const LATT_DEBOLE = termRe(["burro","caseina","caseinato","caseinati","proteine del latte","grasso del latte","grasso anidro del latte","formaggio","formaggi"]);
const TAG_SENZA_GLUTINE = ["en:no-gluten","en:gluten-free","en:crossed-grain-symbol","it:senza-glutine","fr:sans-gluten"];
const TAG_SENZA_LATTOSIO = ["en:no-lactose","en:lactose-free","it:senza-lattosio","en:low-lactose"];
const FORMAGGI_STAGIONATI = /parmigiano|grana padano|pecorino|emmental|gruy[eè]re|provolone|asiago stagionato|montasio stagionato/i;

const testa = (re, ex, testo) => !!re && re.test(ex ? testo.replace(new RegExp(ex.source, "giu"), " ") : testo);
const haGlutine = ing => testa(GLUT_FORTE, GLUT_ESCL, ing.text) || GLUT_TAGS.has(ing.id);

/* ===================== MOTORE ===================== */
function appiattisci(list, out = []) {
  (list || []).forEach((ing, i) => {
    const pct = typeof ing.percent_estimate === "number" ? ing.percent_estimate : (typeof ing.percent === "number" ? ing.percent : null);
    out.push({ text: (ing.text || "").toLowerCase(), id: (ing.id || "").toLowerCase(), pct, pos: i });
    if (ing.ingredients) appiattisci(ing.ingredients, out);
  });
  return out;
}
function daTesto(t) {
  return t.toLowerCase().split(/[,;()\[\]]+/).map(s => s.trim()).filter(Boolean).map((s, i) => ({ text: s, id: "", pct: null, pos: i }));
}
const STIMA_POS = [40, 20, 10, 6, 4, 3, 2];
const pctDi = ing => ing.pct != null ? ing.pct : (STIMA_POS[ing.pos] ?? 1.5);
const corrisponde = (a, ing) => testa(a.re, a.ex, ing.text) || (ing.id && a.tags.has(ing.id));

// livello del gruppo nell'alimento, ridotto se l'ingrediente è presente in piccola quantità
function dose(liv, pct, conc) {
  if (conc) return pct >= 1 ? liv : Math.max(liv - 1, 0);
  return pct >= 10 ? liv : pct >= 2 ? Math.min(liv, 1) : 0;
}

function valutaFodmap(ings, ctx) {
  const gruppi = Object.fromEntries(GRUPPI.map(g => [g, { nome: DB.gruppi[g], liv: -1, trovati: new Map() }]));
  if (ctx.senzaLattosio || ctx.stagionato) gruppi.lattosio.nota = ctx.senzaLattosio ? "Prodotto senza lattosio" : "Formaggio stagionato: lattosio quasi assente";
  for (const ing of ings) for (const a of ALIMENTI) {
    if (!corrisponde(a, ing)) continue;
    const p = pctDi(ing);
    for (const g of GRUPPI) {
      const L = LIVN[a.livelli?.[g]];
      if (L == null || (g === "lattosio" && gruppi.lattosio.nota)) continue;
      if (g === "fruttani" && ctx.senzaGlutine && a.nome === "Frumento") continue;
      const l = dose(L, p, a.concentrato);
      const prev = gruppi[g].trovati.get(a.nome);
      if (!prev || l > prev.l || p > prev.p) gruppi[g].trovati.set(a.nome, { nome: a.nome, p, l, stimato: ing.pct == null });
    }
  }
  for (const g of GRUPPI) {
    const arr = [...gruppi[g].trovati.values()].sort((x, y) => y.l - x.l || y.p - x.p);
    gruppi[g].trovati = arr;
    gruppi[g].liv = arr.length ? Math.max(...arr.map(x => x.l)) : -1;
  }
  const livs = GRUPPI.map(g => gruppi[g].liv);
  let tot = Math.max(...livs);
  if (livs.filter(l => l >= 1).length >= 3 && tot < 2) tot = 2; // effetto cumulativo
  return { gruppi, tot: Math.max(tot, 0), nessuno: tot < 0 };
}

function valutaGlutine(p, ings, haIngr, ctx) {
  const all = (p.allergens_tags || []).includes("en:gluten");
  const tr = (p.traces_tags || []).includes("en:gluten");
  const forti = new Set(), avena = [];
  ings.forEach(i => { if (haGlutine(i)) forti.add(i.text || i.id); if (testa(AVENA, null, i.text) || i.id === "en:oat" || i.id === "en:oats") avena.push(i.text); });
  if (ctx.senzaGlutine) return { c: "ok", v: "Senza glutine", n: "Certificato in etichetta" + (tr ? " (tracce dichiarate: verifica)" : "") };
  if (all || forti.size) return { c: "bad", v: "Contiene glutine", n: forti.size ? [...forti].slice(0, 3).join(", ") : "Allergene dichiarato" };
  if (tr) return { c: "warn", v: "Possibili tracce", n: "Rischio contaminazione dichiarato" };
  if (avena.length) return { c: "warn", v: "Avena non certificata", n: "Rischio contaminazione" };
  if (haIngr) return { c: "ok", v: "Non rilevato", n: "Nessun ingrediente con glutine né tracce, ma niente certificazione" };
  return { c: "na", v: "Dati mancanti", n: "Ingredienti non disponibili" };
}

function valutaLattosio(p, ings, haIngr, ctx) {
  if (ctx.senzaLattosio) return { c: "ok", v: "Senza lattosio", n: "Indicato in etichetta" };
  if (ctx.stagionato) return { c: "ok", v: "Quasi assente", n: "Formaggio stagionato" };
  const forti = new Set(), deboli = new Set();
  for (const i of ings) {
    for (const a of ALIMENTI) {
      const L = LIVN[a.livelli?.lattosio];
      if (L == null || !corrisponde(a, i)) continue;
      (L >= 1 ? forti : deboli).add(a.nome);
    }
    if (testa(LATT_DEBOLE, null, i.text)) deboli.add(i.text);
  }
  const all = (p.allergens_tags || []).includes("en:milk");
  const tr = (p.traces_tags || []).includes("en:milk");
  if (forti.size) return { c: "bad", v: "Contiene lattosio", n: [...forti].slice(0, 3).join(", ") };
  if (deboli.size) return { c: "warn", v: "Poco lattosio", n: [...deboli].slice(0, 3).join(", ") };
  if (all) return { c: "warn", v: "Contiene latte", n: "Derivati non specificati" };
  if (tr) return { c: "ok", v: "Solo tracce di latte", n: "Irrilevanti per l'intolleranza, non per l'allergia" };
  if (haIngr) return { c: "ok", v: "Non rilevato", n: "Nessun derivato del latte" };
  return { c: "na", v: "Dati mancanti", n: "Ingredienti non disponibili" };
}

/* ===================== OPEN FOOD FACTS ===================== */
const OFF = "https://world.openfoodfacts.org";
const CAMPI = "product_name_it,product_name,brands,image_front_small_url,ingredients_text_it,ingredients_text,ingredients,allergens_tags,traces_tags,labels_tags,categories_tags";
async function cercaProdotto(code) {
  const r = await fetch(`${OFF}/api/v2/product/${code}.json?lc=it&fields=${CAMPI}`);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("Open Food Facts ha risposto con errore " + r.status);
  const j = await r.json();
  return j.status === 1 ? j.product : null;
}
async function cercaTesto(q) {
  const f = "code,product_name_it,product_name,brands,image_front_small_url";
  try {
    const u = `${OFF}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=20&lc=it&fields=${f}` +
      `&tagtype_0=countries&tag_contains_0=contains&tag_0=italy`;
    const r = await fetch(u);
    if (!r.ok) throw new Error(r.status);
    return (await r.json()).products || [];
  } catch {
    const r = await fetch(`https://search.openfoodfacts.org/search?q=${encodeURIComponent(q)}&langs=it&page_size=20&fields=${f}`);
    if (!r.ok) throw new Error("ricerca non disponibile (" + r.status + ")");
    return (await r.json()).hits || [];
  }
}

/* ===================== UI ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const stato = (html, err) => { $("#stato").innerHTML = html ? `<div class="msg${err ? " err" : ""}">${html}</div>` : ""; };
const erroreRete = e => location.protocol !== "https:" && location.hostname !== "localhost"
  ? "La pagina è aperta da un file o da un'anteprima, e il browser blocca le richieste esterne. Aprila dall'indirizzo https di GitHub Pages."
  : "Open Food Facts non risponde. Controlla la connessione e riprova tra poco. (" + esc(e.message) + ")";
const norm = s => s.toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu, "").trim();

async function cerca(q) {
  q = String(q || "").trim();
  if (!q) return;
  $("#q").value = q;
  if (!DB) { try { await caricaDB(); } catch (e) { stato("Tabella FODMAP non caricata: " + esc(e.message), true); return; } }
  const cifre = q.replace(/\s/g, "");
  if (/^\d{8,14}$/.test(cifre)) return analizza(cifre);
  if (/^\d+$/.test(cifre)) { stato("Il codice EAN deve avere da 8 a 14 cifre.", true); return; }
  return cercaAlimento(q);
}

/* ---- ricerca per nome ---- */
function trovaInTabella(q) {
  const n = norm(q), parole = n.split(/\s+/).filter(w => w.length > 2);
  return ALIMENTI.map(a => {
    const nomi = [a.nome, ...(a.termini || [])].map(norm);
    let s = 0;
    if (nomi.some(x => x === n)) s = 3;
    else if (nomi.some(x => { const b = x.replace("*", ""); return x.startsWith(n) || (b.length >= 4 && n.startsWith(b)); })) s = 2;
    else if (parole.some(w => nomi.some(x => x.split(/\s+/).some(t => t.length > 3 && t.slice(0, -1) === w.slice(0, -1))))) s = 1; // singolare/plurale
    return { a, s };
  }).filter(x => x.s).sort((x, y) => y.s - x.s).filter((x, _, arr) => x.s >= arr[0].s - 1 && (x.s > 1 || arr[0].s === 1)).slice(0, 5).map(x => x.a);
}
function schedaAlimento(a) {
  const livs = GRUPPI.map(g => LIVN[a.livelli?.[g]] ?? -1);
  const tot = Math.max(...livs);
  const glut = (a.termini || []).some(t => GLUT_FORTE.test(t) && !(GLUT_ESCL && GLUT_ESCL.test(t)));
  const celle = GRUPPI.map((g, i) => {
    const l = livs[i];
    return `<div class="${l < 0 ? "na" : CLS_LIV[l]}"><b>${esc(DB.gruppi[g].split(" ")[0])}</b>${l < 0 ? "Assente" : NOME_LIV[l]}</div>`;
  }).join("");
  return `<div class="cibo">
    <div class="row" style="justify-content:space-between"><h2>${esc(a.nome)}</h2>
      <span class="pill ${tot < 0 ? "ok" : CLS_LIV[tot]}">FODMAP ${tot < 0 ? "basso" : NOME_LIV[tot].toLowerCase()}</span></div>
    <div class="lv">${celle}</div>
    ${glut ? `<div class="pill bad" style="justify-self:start">Contiene glutine</div>` : ""}
    ${a.porzione ? `<div><span class="label">Porzione</span> ${esc(a.porzione)}</div>` : ""}
    ${a.note ? `<div class="sub" style="margin:0">${esc(a.note)}</div>` : ""}
  </div>`;
}
async function cercaAlimento(q) {
  $("#risultato").hidden = false;
  const hit = trovaInTabella(q);
  const blocco = hit.length
    ? `<div class="panel"><div class="label">Nella tua tabella</div>${hit.map(schedaAlimento).join("")}</div>`
    : `<div class="panel"><div class="label">Nella tua tabella</div><p style="margin:0">Nessun alimento corrisponde a "${esc(q)}". Puoi aggiungerlo dalla <a href="tabella.html">Tabella FODMAP</a>.</p></div>`;
  $("#risultato").innerHTML = blocco + `<div class="panel" id="offBox"><div class="label">Prodotti confezionati</div><div class="msg">Cerco su Open Food Facts…</div></div>`;
  stato("");
  try {
    const prodotti = (await cercaTesto(q)).filter(p => p.code);
    $("#offBox").innerHTML = `<div class="label">Prodotti confezionati (${prodotti.length})</div>` + (prodotti.length
      ? `<div class="lista">${prodotti.map(p => `<button data-q="${esc(p.code)}">
          ${p.image_front_small_url ? `<img src="${esc(p.image_front_small_url)}" alt="" loading="lazy">` : `<div class="noimg"></div>`}
          <span><b>${esc(p.product_name_it || p.product_name || "Senza nome")}</b><br><small>${esc(p.brands || "")}</small></span>
          <span class="code">›</span></button>`).join("")}</div>`
      : `<p style="margin:0">Nessun prodotto trovato.</p>`);
  } catch (e) {
    $("#offBox").innerHTML = `<div class="label">Prodotti confezionati</div><div class="msg err">${erroreRete(e)}</div>`;
  }
}

/* ---- analisi prodotto ---- */
async function analizza(code) {
  stato("Cerco il prodotto…"); $("#risultato").hidden = true;
  let p;
  try { p = await cercaProdotto(code); }
  catch (e) { stato(erroreRete(e), true); return; }
  if (!p) { stato(`Prodotto <b>${code}</b> non presente in Open Food Facts. Puoi aggiungerlo dall'app Open Food Facts.`, true); return; }
  stato("");

  const testo = p.ingredients_text_it || p.ingredients_text || "";
  const ings = p.ingredients?.length ? appiattisci(p.ingredients) : daTesto(testo);
  const haIngr = ings.length > 0;
  const labels = p.labels_tags || [];
  const nome = p.product_name_it || p.product_name || "Prodotto senza nome";
  const ctx = {
    senzaGlutine: labels.some(t => TAG_SENZA_GLUTINE.includes(t)) || /senza glutine/i.test(testo),
    senzaLattosio: labels.some(t => TAG_SENZA_LATTOSIO.includes(t)) || /senza lattosio|delattosat/i.test(testo + " " + nome),
    stagionato: FORMAGGI_STAGIONATI.test(nome + " " + (p.categories_tags || []).join(" ")),
  };
  const g = valutaGlutine(p, ings, haIngr, ctx);
  const l = valutaLattosio(p, ings, haIngr, ctx);
  const f = haIngr ? valutaFodmap(ings, ctx) : null;
  const fSem = !f ? { c: "na", v: "Dati mancanti", n: "Ingredienti non disponibili" }
    : f.nessuno ? { c: "ok", v: "Basso", n: "Nessuna fonte FODMAP rilevata" }
    : { c: CLS_LIV[f.tot], v: NOME_LIV[f.tot], n: GRUPPI.filter(k => f.gruppi[k].liv >= 1).map(k => DB.gruppi[k].split(" ")[0]).join(", ") || "Solo fonti in quantità basse" };

  const sem = (t, s) => `<div class="sem ${s.c}"><span class="t">${t}</span><span class="v">${esc(s.v)}</span><span class="n">${esc(s.n)}</span></div>`;
  const dettaglio = f ? GRUPPI.map(k => {
    const gr = f.gruppi[k];
    const pill = gr.liv < 0 ? `<span class="pill ok">Assente</span>` : `<span class="pill ${CLS_LIV[gr.liv]}">${NOME_LIV[gr.liv]}</span>`;
    const det = gr.nota ? esc(gr.nota)
      : gr.trovati.length ? gr.trovati.map(x => `<b>${esc(x.nome)}</b> ${x.stimato ? "~" : ""}${x.p.toFixed(x.p < 1 ? 1 : 0)}%`).join(" · ")
      : "Nessuna fonte rilevata";
    return `<div class="grp"><h3>${esc(gr.nome)}</h3>${pill}<div class="det">${det}</div></div>`;
  }).join("") : "";

  $("#risultato").innerHTML = `
    <div class="panel">
      <div class="prod">
        ${p.image_front_small_url ? `<img src="${esc(p.image_front_small_url)}" alt="">` : `<div class="noimg"></div>`}
        <div><h2>${esc(nome)}</h2><div class="sub">${esc(p.brands || "")}</div><div class="code">${code}</div></div>
      </div>
      <div class="semafori">${sem("Glutine", g)}${sem("Lattosio", l)}${sem("FODMAP", fSem)}</div>
    </div>
    ${f ? `<div class="panel"><h2>FODMAP per gruppo</h2><div>${dettaglio}</div>
      <p class="sub" style="margin:0">Percentuali: quota stimata dell'ingrediente nel prodotto (~ = dalla posizione in lista). Le fonti concentrate (aglio, cipolla, miele, inulina, polioli) pesano anche in piccole quantità.</p></div>` : ""}
    <div class="panel"><h3>Ingredienti</h3><div class="ingr">${esc(testo || "Non disponibili")}</div></div>
    <div class="panel"><h3>Da sapere</h3><ul class="note">
      <li>I dati sono inseriti da volontari: confronta sempre con l'etichetta della confezione.</li>
      <li>Il livello FODMAP dipende da porzione e lavorazione: è una stima dagli ingredienti, non un'analisi di laboratorio.</li>
      <li>Per la celiachia conta solo la certificazione "senza glutine" o la spiga barrata.</li>
    </ul></div>`;
  $("#risultato").hidden = false;
  salvaStorico(code, nome, `G: ${g.v} · L: ${l.v} · F: ${fSem.v}`);
}

/* ---- storico (solo su questo dispositivo) ---- */
function leggiStorico() { try { return JSON.parse(localStorage.getItem("scanner-storico") || "[]"); } catch { return []; } }
function salvaStorico(code, nome, r) {
  const h = leggiStorico().filter(x => x.code !== code);
  h.unshift({ code, nome, r });
  try { localStorage.setItem("scanner-storico", JSON.stringify(h.slice(0, 15))); } catch {}
  mostraStorico();
}
function mostraStorico() {
  const h = leggiStorico();
  $("#storico").hidden = !h.length;
  $("#histList").innerHTML = h.map(x => `<button data-q="${esc(x.code)}"><div class="noimg" style="width:48px;height:48px"></div><span><b>${esc(x.nome)}</b><br><small>${esc(x.r)}</small></span><span class="code">${esc(x.code)}</span></button>`).join("");
}

/* ---- fotocamera ---- */
let stream = null, loopId = null, zxReader = null;
async function avviaScan() {
  stato("");
  if (!navigator.mediaDevices?.getUserMedia) { stato("Questo browser non dà accesso alla fotocamera. Apri la pagina in Chrome tramite https, oppure scrivi il codice.", true); return; }
  $("#cam").hidden = false; $("#btnStop").hidden = false; $("#btnScan").hidden = true;
  const video = $("#video");
  try {
    if ("BarcodeDetector" in window) {
      const det = new BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e"] });
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      video.srcObject = stream; await video.play();
      const tick = async () => {
        if (!stream) return;
        try { const c = await det.detect(video); if (c.length) { fermaScan(); cerca(c[0].rawValue); return; } } catch {}
        loopId = setTimeout(tick, 200);
      };
      tick();
    } else {
      await caricaZxing();
      zxReader = new ZXing.BrowserMultiFormatReader();
      await zxReader.decodeFromConstraints({ video: { facingMode: "environment" } }, video, res => {
        if (res) { fermaScan(); cerca(res.getText()); }
      });
    }
  } catch (e) {
    fermaScan();
    stato(e.name === "NotAllowedError" ? "Permesso fotocamera negato. Abilitalo nelle impostazioni del browser o scrivi il codice." : "Fotocamera non disponibile: " + esc(e.message), true);
  }
}
function fermaScan() {
  clearTimeout(loopId);
  if (zxReader) { try { zxReader.reset(); } catch {} zxReader = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $("#video").srcObject = null;
  $("#cam").hidden = true; $("#btnStop").hidden = true; $("#btnScan").hidden = false;
}
function caricaZxing() {
  return window.ZXing ? Promise.resolve() : new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = "https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js";
    s.onload = ok; s.onerror = () => ko(new Error("libreria scanner non caricata"));
    document.head.appendChild(s);
  });
}

/* ---- eventi ---- */
$("#btnScan").onclick = avviaScan;
$("#btnStop").onclick = fermaScan;
$("#form").onsubmit = e => { e.preventDefault(); cerca($("#q").value); };
document.addEventListener("click", e => { const b = e.target.closest("[data-q]"); if (b) { e.preventDefault(); cerca(b.dataset.q); window.scrollTo({ top: 0, behavior: "smooth" }); } });
mostraStorico();
caricaDB().catch(e => stato("Tabella FODMAP non caricata: " + esc(e.message) + ". Controlla che fodmap.json sia nel repository.", true));
</script>
